<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Установка ИИ-ассистента эксперта</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="//api.bitrix24.com/api/v1/"></script>
</head>
<body>
  <main class="install-card">
    <h1>ИИ-ассистент эксперта MAVIS GROUP</h1>
    <p>Завершаем установку локального приложения в Bitrix24.</p>
    <button id="finish-install" class="primary">Завершить установку</button>
    <p id="status" class="muted"></p>
  </main>
  <script>
    function finish() {
      const status = document.getElementById('status');
      status.textContent = 'Отправляем подтверждение установки...';
      BX24.init(function () {
        BX24.installFinish();
        status.textContent = 'Установка завершена. Если страница не перешла автоматически, откройте приложение из меню Bitrix24.';
      });
    }
    document.getElementById('finish-install').addEventListener('click', finish);
    window.addEventListener('load', () => setTimeout(finish, 600));
  </script>
</body>
</html>
